<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 492" width="360" height="492" role="img" aria-label="Arquitetura do RodoIA, de cima para baixo: a pergunta do usuário chega ao agente (LangGraph), que passa por guardrail, roteador e síntese e aciona três frentes: RAG regulatório (E5, BM25 e RRF), modelo com fine-tuning (QLoRA e vLLM fp8) e dados estruturados (DuckDB e previsão). As três se apoiam nos fundamentos de ML, com backpropagation e attention escritos à mão. O MLOps (gate de CI, MLflow, DVC, drift e custo) governa o agente.">
  <title>Arquitetura do RodoIA, de cima para baixo: a pergunta do usuário chega ao agente (LangGraph), que passa por guardrail, roteador e síntese e aciona três frentes: RAG regulatório (E5, BM25 e RRF), modelo com fine-tuning (QLoRA e vLLM fp8) e dados estruturados (DuckDB e previsão). As três se apoiam nos fundamentos de ML, com backpropagation e attention escritos à mão. O MLOps (gate de CI, MLflow, DVC, drift e custo) governa o agente.</title>
  <defs>
    <clipPath id="canto"><rect width="360" height="492" rx="14"/></clipPath>
    <linearGradient id="marca" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="0.5" stop-color="#818cf8"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#canto)">
    <rect width="360" height="492" fill="#0d1117"/>
    <rect y="489" width="360" height="3" fill="url(#marca)" opacity="0.85"/>
  </g>
  <rect x="0.5" y="0.5" width="359" height="491" rx="13.5" fill="none" stroke="#30363d"/>
  <g font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif">
    <rect x="16" y="16" width="328" height="40" rx="10" fill="#161b22" stroke="#66728f" stroke-width="1.5"/>
    <text x="26" y="41" font-size="14" font-weight="700" fill="#e6edf3" textLength="133.6" lengthAdjust="spacingAndGlyphs">Pergunta do usuário</text>
    <rect x="16" y="80" width="328" height="60" rx="10" fill="#161b22" stroke="#66728f" stroke-width="1.5"/>
    <text x="26" y="105" font-size="14" font-weight="700" fill="#e6edf3" textLength="133.8" lengthAdjust="spacingAndGlyphs">Agente (LangGraph)</text>
    <text x="26" y="125" font-size="14" font-weight="400" fill="#b4bfd0" textLength="190.9" lengthAdjust="spacingAndGlyphs">guardrail → roteador → síntese</text>
    <rect x="16" y="172" width="104" height="100" rx="10" fill="#161b22" stroke="#66728f" stroke-width="1.5"/>
    <text x="26" y="197" font-size="14" font-weight="700" fill="#e6edf3" textLength="28.8" lengthAdjust="spacingAndGlyphs">RAG</text>
    <text x="26" y="217" font-size="14" font-weight="700" fill="#e6edf3" textLength="73.9" lengthAdjust="spacingAndGlyphs">regulatório</text>
    <text x="26" y="237" font-size="14" font-weight="400" fill="#b4bfd0" textLength="67.6" lengthAdjust="spacingAndGlyphs">E5 + BM25</text>
    <text x="26" y="257" font-size="14" font-weight="400" fill="#b4bfd0" textLength="37.0" lengthAdjust="spacingAndGlyphs">+ RRF</text>
    <rect x="128" y="172" width="104" height="100" rx="10" fill="#161b22" stroke="#66728f" stroke-width="1.5"/>
    <text x="138" y="197" font-size="14" font-weight="700" fill="#e6edf3" textLength="82.7" lengthAdjust="spacingAndGlyphs">Modelo com</text>
    <text x="138" y="217" font-size="14" font-weight="700" fill="#e6edf3" textLength="74.6" lengthAdjust="spacingAndGlyphs">fine-tuning</text>
    <text x="138" y="237" font-size="14" font-weight="400" fill="#b4bfd0" textLength="49.6" lengthAdjust="spacingAndGlyphs">QLoRA ·</text>
    <text x="138" y="257" font-size="14" font-weight="400" fill="#b4bfd0" textLength="56.5" lengthAdjust="spacingAndGlyphs">vLLM fp8</text>
    <rect x="240" y="172" width="104" height="100" rx="10" fill="#161b22" stroke="#66728f" stroke-width="1.5"/>
    <text x="250" y="197" font-size="14" font-weight="700" fill="#e6edf3" textLength="41.2" lengthAdjust="spacingAndGlyphs">Dados</text>
    <text x="250" y="217" font-size="14" font-weight="700" fill="#e6edf3" textLength="83.7" lengthAdjust="spacingAndGlyphs">estruturados</text>
    <text x="250" y="237" font-size="14" font-weight="400" fill="#b4bfd0" textLength="55.9" lengthAdjust="spacingAndGlyphs">DuckDB ·</text>
    <text x="250" y="257" font-size="14" font-weight="400" fill="#b4bfd0" textLength="51.8" lengthAdjust="spacingAndGlyphs">previsão</text>
    <rect x="16" y="304" width="328" height="60" rx="10" fill="#161b22" stroke="#66728f" stroke-width="1.5"/>
    <text x="26" y="329" font-size="14" font-weight="700" fill="#e6edf3" textLength="134.0" lengthAdjust="spacingAndGlyphs">Fundamentos de ML</text>
    <text x="26" y="349" font-size="14" font-weight="400" fill="#b4bfd0" textLength="218.4" lengthAdjust="spacingAndGlyphs">backpropagation e attention à mão</text>
    <rect x="16" y="392" width="328" height="80" rx="10" fill="#161b22" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="26" y="417" font-size="14" font-weight="700" fill="#e6edf3" textLength="119.7" lengthAdjust="spacingAndGlyphs">MLOps: gate de CI</text>
    <text x="26" y="437" font-size="14" font-weight="400" fill="#b4bfd0" textLength="162.8" lengthAdjust="spacingAndGlyphs">MLflow · DVC · drift · custo</text>
    <text x="26" y="457" font-size="14" font-weight="600" fill="#22d3ee" textLength="111.7" lengthAdjust="spacingAndGlyphs">governa o agente</text>
    <line x1="180" y1="56" x2="180" y2="72" stroke="#8a97b3" stroke-width="2"/><path d="M175 71 L180 80 L185 71 Z" fill="#8a97b3"/>
    <line x1="180" y1="140" x2="180" y2="156" stroke="#8a97b3" stroke-width="2"/>
    <line x1="68" y1="156" x2="292" y2="156" stroke="#8a97b3" stroke-width="2"/>
