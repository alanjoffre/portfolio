    <line x1="180" y1="288" x2="180" y2="296" stroke="#8a97b3" stroke-width="2"/><path d="M175 295 L180 304 L185 295 Z" fill="#8a97b3"/>
    <line x1="16" y1="378" x2="344" y2="378" stroke="#30363d" stroke-width="1"/>
  </g>
</svg>
