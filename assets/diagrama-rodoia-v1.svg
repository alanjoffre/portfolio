    <line x1="180" y1="156" x2="180" y2="164" stroke="#8a97b3" stroke-width="2"/><path d="M175 163 L180 172 L185 163 Z" fill="#8a97b3"/>
    <line x1="292" y1="156" x2="292" y2="164" stroke="#8a97b3" stroke-width="2"/><path d="M287 163 L292 172 L297 163 Z" fill="#8a97b3"/>
